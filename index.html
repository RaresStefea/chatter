<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Free Chatting Application">
    <meta name="keywords" content="Chatting, Messages">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./media/icons/chatter-logo.svg" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" href="./styling/index.css">
    <title> Chatter</title>
</head>
<body>
   <aside class="left-side-area">

    <section class="app-title">
        
        <h1> CHATTER </h1>

            <button class="sidebar-toggle" aria-label="Open conversations list" aria-expanded="false">
                ☰
            </button>

    </section>


    <section class="search-section">

        <section class="search-bar-wrapper">
            <input type="text" class="search-bar" placeholder="Search...">
        </section>

        <button class="filter-button-wrapper">
          <img src="./media/icons/filter-circle.svg" alt="" aria-hidden="true" width="20" height="20">
        </button>

    </section>


    <section class="messages-section">
        <section class="message-wrapper">
            <section class="person-logo-wrapper">
                <img src="./media/icons/person-circle.svg" alt="" aria-hidden="true" width="20" height="20">
            </section>

            <section class="message-information-wrapper">
                
                <section class="name-wrapper">
                    <span class="name">
                        Person
                    </span>
                </section>
                
                <section class="message-wrapper">
                
                    <span class="message">
                        A sample message.
                    </span>

                </section>
            </section>
            
            
            <section class="message-options-wrapper">
                
                <button class="hide-wrapper">
                    <img src="./media/icons/eye.svg" alt="" aria-hidden="true" width="20" height="20">
                </button>
                
                <button class="delete-wrapper">
                    <img src="./media/icons/trash.svg" alt="" aria-hidden="true" width="20" height="20">
                
                </button>
            </section>
        </section>


        
    </section>


    <section class="options-section">
        
        <button class="add-wrapper">
            <img src="./media/icons/person-add.svg" alt="" aria-hidden="true" width="20" height="20">
        </button>
        
        <button class="settings-wrapper">
            <img src="./media/icons/gear-fill.svg" alt="" aria-hidden="true" width="20" height="20">
       
        </button>

    </section>
   </aside>




   
   <main class="right-side-area">
        <nav class="convo-information">
            
            <div class="hamburger-mobile">
                <button class="sidebar-toggle" aria-label="Open conversations list" aria-expanded="false">
                        ☰
                    </button>
            </div>
            
            <div class="person-info-wrapper">  
                <button class="person-logo-wrapper">
                    <img src="./media/icons/person-circle.svg" alt="" aria-hidden="true" width="20" height="20">
                </button>

                <section class="person-name">
                    <h2>Name</h2>
                </section>
            </div>  

        </nav>


        <section class="sent-messages-wrapper">
           
            <section class="message-box">
                <p>Sample Message</p>
            
            </section>
        </section>
        

        <section class="message-bar-wrapper">
            
            <button class="document-wrapper">
                <img src="./media/icons/file-text-fill.svg" alt="" aria-hidden="true" width="20" height="20">
            </button>
            
            <section class="message-input-wrapper">
                <input type="text" placeholder="Write your message">
            </section>
            
            <button class="send-wrapper">
             <img src="./media/icons/eye.svg" alt="" aria-hidden="true" width="20" height="20">
            </button>
        
        </section>
    </main>

</body>
</html>
